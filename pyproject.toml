[project]
name = "eo-scene-agent"
version = "0.1.0"
description = "Conversational Sentinel-2 scene finder: LangGraph agent + MCP server + FastAPI"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
